<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>User Schedule Page</title>
</head>
<body>
<div class="main">
    <h2>IDENTITY</h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/getUserSchedule}" method="get">
                <input type="date" name="dateFrom" class="teacher-input-field-date-from" placeholder="Write date from">
                <input type="date" name="dateTo" class="teacher-input-field-date-to" placeholder="Write date to">
                <button type="submit" class="submit-btn">Show Schedule</button>
            </form>
            <div class="user-lessons-container">
                <table class="user-lessons-table">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Subject</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="lesson : ${userLessons}">
                        <tr>
                            <td th:text="${lesson.date}"></td>
                            <td th:text="${lesson.startTime}"></td>
                            <td th:text="${lesson.endTime}"></td>
                            <td th:text="${lesson.subject.name}"></td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
