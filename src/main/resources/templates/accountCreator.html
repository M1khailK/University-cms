<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Account Creator Page</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="accountCreatorForm.css">
    <script src="https://kit.fontawesome.com/8d224a8437.js" crossorigin="anonymous"></script>
    <script src="/webjars/jquery/3.6.4/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.2.3/js/bootstrap.min.js"></script>
</head>
<body>
<div class="main">
    <div class="url">
        <a href="/">Main Page</a>
    </div>
    <div class="form-container studentAccount">
        <h2>Student Account Creation</h2>
        <form th:action="@{/createStudent}" method="post" name="studentForm" th:object="${user}">
            <label>First Name</label> <input type="text" name="user.firstName">
            <label>Last Name</label> <input type="text" name="user.lastName">
            <label>Email</label> <input type="text" name="user.email">
            <label>Group</label> <input type="text" name="user.groupName">
            <label>Password</label> <input type="text" name="user.password">
            <button type="submit" class="submit">Create Student Account</button>
        </form>
    </div>
    <div class="form-container teacherAccount">
        <h2>Teacher Account Creation</h2>
        <form th:action="@{/createTeacher}" method="post" name="teacherForm">
            <label>First Name</label> <input type="text" name="firstName">
            <label>Last Name</label> <input type="text" name="lastName">
            <label>Email</label> <input type="text" name="email">
            <label>Password</label> <input type="text" name="password">
            <button type="submit" class="submit">Create Teacher Account</button>
        </form>
    </div>
    <div class="form-container adminAccount">
        <h2>Admin Account Creation</h2>
        <form th:action="@{/createAdmin}" method="post" name="adminForm">
            <label>First Name</label> <input type="text" name="firstName">
            <label>Last Name</label> <input type="text" name="lastName">
            <label>Email</label> <input type="text" name="email">
            <label>Password</label> <input type="text" name="password">
            <button type="submit" class="submit">Create Admin Account</button>
        </form>
    </div>
</div>
</body>
</html>
