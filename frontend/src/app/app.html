<mat-toolbar>
  <span>University CMS</span>

  <span class="toolbar-spacer"></span>

  @if (isAuthenticated()) {

    <button mat-button type="button" (click)="logout()">Logout</button>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
